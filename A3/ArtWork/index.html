<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Art Work</title>
    <script
      src="https://kit.fontawesome.com/b51a179b2b.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="art-section">
      <div class="dot dot-1"></div>
      <div class="dot dot-2"></div>
      <div class="dot dot-3"></div>
      <div class="dot dot-4"></div>
      <div class="dot dot-5"></div>
      <div class="dot dot-6"></div>

      <div class="top-bar">
        <h1>Explore Art Work</h1>
        <a href="#">See All</a>
      </div>

      <div class="cards">
        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1633174524827-db00a6b7bc74?auto=format&fit=crop&w=600&q=80"
            alt="Monocular"
          />
          <div class="info">
            <h2>Monocular</h2>
            <div class="likes">
              <span>54.8k</span>
              <span><i class="fa-regular fa-heart"></i></span>
            </div>
          </div>
          <button>Place Bid</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1601933470096-0e34634ffcde?auto=format&fit=crop&w=600&q=80"
            alt="Horns Mask"
          />
          <div class="info">
            <h2>Horns Mask</h2>
            <div class="likes">
              <span>32.4k</span>
              <span><i class="fa-regular fa-heart"></i></span>
            </div>
          </div>
          <button>Place Bid</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&w=600&q=80"
            alt="Light Moon"
          />
          <div class="info">
            <h2>Light Moon</h2>
            <div class="likes">
              <span>86.6k</span>
              <span><i class="fa-regular fa-heart"></i></span>
            </div>
          </div>
          <button>Place Bid</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1604079628040-94301bb21b91?auto=format&fit=crop&w=600&q=80"
            alt="Skull Wire"
          />
          <div class="info">
            <h2>Skull Wire</h2>
            <div class="likes">
              <span>78.6k</span>
              <span><i class="fa-regular fa-heart"></i></span>
            </div>
          </div>
          <button>Place Bid</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1635805737707-575885ab0820?auto=format&fit=crop&w=600&q=80"
            alt="Spiderman"
          />
          <div class="info">
            <h2>Spiderman</h2>
            <div class="likes">
              <span>24.8k</span>
              <span><i class="fa-regular fa-heart"></i></span>
            </div>
          </div>
          <button>Place Bid</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1611604548018-d56bbd85d681?auto=format&fit=crop&w=600&q=80"
            alt="DeadPool"
          />
          <div class="info">
            <h2>DeadPool</h2>
            <div class="likes">
              <span>59.7k</span>
              <span><i class="fa-regular fa-heart"></i></span>
            </div>
          </div>
          <button>Place Bid</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1635776062043-223faf322554?auto=format&fit=crop&w=600&q=80"
            alt="White Eye"
          />
          <div class="info">
            <h2>White Eye</h2>
            <div class="likes">
              <span>45.7k</span>
              <span><i class="fa-regular fa-heart"></i></span>
            </div>
          </div>
          <button>Place Bid</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1530026405186-ed1f139313f8?auto=format&fit=crop&w=600&q=80"
            alt="Plastic Spinal"
          />
          <div class="info">
            <h2>Plastic Spinal</h2>
            <div class="likes">
              <span>96.6k</span>
              <span><i class="fa-regular fa-heart"></i></span>
            </div>
          </div>
          <button>Place Bid</button>
        </div>
      </div>
    </section>
  </body>
</html>
